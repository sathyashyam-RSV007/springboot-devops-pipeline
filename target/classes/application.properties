# Dev mode: serve the page straight from the source folder, so edits show on browser refresh (no rebuild)
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=pick-your-sky
